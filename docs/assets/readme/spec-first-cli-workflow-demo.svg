<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">spec-first 项目架构与可信变更闭环</title>
<desc id="desc">图示 spec-first 位于 AI coding 宿主与项目之间，连接意图、上下文、范围、产物、证据和知识。宿主提供模型与工具，脚本准备确定性事实，LLM 做语义判断，项目 owner 授权副作用。</desc>
<defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#F8FAFC"/><stop offset="1" stop-color="#EEF2F7"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="16" flood-opacity=".12"/></filter><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif}.h{font-size:32px;font-weight:750;fill:#101828}.sub{font-size:15px;fill:#667085}.t{font-size:18px;font-weight:720;fill:#101828}.b{font-size:14px;fill:#475467}.s{font-size:13px;fill:#667085}.chip{font-size:13px;font-weight:700;fill:#344054;text-anchor:middle}.arrow{stroke:#98A2B3;stroke-width:2;marker-end:url(#a)}</style><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#98A2B3"/></marker></defs>
<rect width="1200" height="675" fill="url(#bg)"/><text x="600" y="52" text-anchor="middle" class="h">spec-first：项目拥有的可信变更闭环</text><text x="600" y="80" text-anchor="middle" class="sub">连接宿主能力与项目长期资产，约束能够声称什么</text>
<g transform="translate(55 115)" filter="url(#shadow)"><rect width="1090" height="128" rx="18" fill="#E0F2FE" stroke="#7DD3FC"/><text x="26" y="34" class="t">AI coding host</text><text x="26" y="62" class="b">Claude Code · Codex · Kiro · Qoder · Cursor · OpenCode · ZCode · Pi</text><text x="26" y="94" class="s">提供模型、工具、权限与执行 primitive；宿主 runtime 是可重建的 delivery projection</text><rect x="790" y="28" width="260" height="58" rx="12" fill="#fff"/><text x="920" y="53" class="chip">生成代码与运行命令</text><text x="920" y="73" class="chip">宿主负责执行</text></g>
<path d="M600 243V278" class="arrow"/><g transform="translate(55 280)" filter="url(#shadow)"><rect width="1090" height="155" rx="18" fill="#EEF2FF" stroke="#A5B4FC"/><text x="26" y="34" class="t">spec-first 连接与治理层</text><text x="26" y="62" class="b">Intent · Context · Scope · Artifact · Claim · Evidence · Handoff · Knowledge</text><rect x="26" y="84" width="320" height="48" rx="10" fill="#fff"/><text x="186" y="105" class="chip">Scripts / Tools</text><text x="186" y="123" class="s" text-anchor="middle">准备路径、schema、hash、exit code 等事实</text><rect x="385" y="84" width="320" height="48" rx="10" fill="#fff"/><text x="545" y="105" class="chip">LLM / Agents</text><text x="545" y="123" class="s" text-anchor="middle">判断需求、取舍、风险与语义充分性</text><rect x="744" y="84" width="320" height="48" rx="10" fill="#fff"/><text x="904" y="105" class="chip">Project owner</text><text x="904" y="123" class="s" text-anchor="middle">授权副作用、裁决价值与最终验收</text></g>
<path d="M600 435V468" class="arrow"/><g transform="translate(55 470)" filter="url(#shadow)"><rect width="1090" height="150" rx="18" fill="#ECFDF3" stroke="#86EFAC"/><text x="26" y="34" class="t">Project-owned source &amp; evidence</text><text x="26" y="62" class="b">Codebase → Spec → Plan → Tasks → Code → Review → Knowledge</text><g transform="translate(26 82)"><rect width="180" height="40" rx="10" fill="#fff"/><text x="90" y="25" class="chip">canonical source</text><rect x="195" width="180" height="40" rx="10" fill="#fff"/><text x="285" y="25" class="chip">workflow artifacts</text><rect x="390" width="180" height="40" rx="10" fill="#fff"/><text x="480" y="25" class="chip">verification evidence</text><rect x="585" width="180" height="40" rx="10" fill="#fff"/><text x="675" y="25" class="chip">durable knowledge</text><rect x="780" width="250" height="40" rx="10" fill="#fff"/><text x="905" y="25" class="chip">可回源、可失效、可复用</text></g></g>
</svg>
