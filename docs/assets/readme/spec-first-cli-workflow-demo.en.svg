<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">spec-first architecture and trusted-change loop</title>
<desc id="desc">spec-first sits between the AI coding host and the project, connecting intent, context, scope, artifacts, evidence, and knowledge. The host provides models and tools; scripts prepare deterministic facts; LLMs make semantic judgments; project owners authorize side effects.</desc>
<defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#F8FAFC"/><stop offset="1" stop-color="#EEF2F7"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="16" flood-opacity=".12"/></filter><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif}.h{font-size:32px;font-weight:750;fill:#101828}.sub{font-size:15px;fill:#667085}.t{font-size:18px;font-weight:720;fill:#101828}.b{font-size:14px;fill:#475467}.s{font-size:12px;fill:#667085}.chip{font-size:13px;font-weight:700;fill:#344054;text-anchor:middle}.arrow{stroke:#98A2B3;stroke-width:2;marker-end:url(#a)}</style><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#98A2B3"/></marker></defs>
<rect width="1200" height="675" fill="url(#bg)"/><text x="600" y="52" text-anchor="middle" class="h">spec-first: a project-owned trusted-change loop</text><text x="600" y="80" text-anchor="middle" class="sub">Connect host capabilities to durable project assets and bound every claim</text>
<g transform="translate(55 115)" filter="url(#shadow)"><rect width="1090" height="128" rx="18" fill="#E0F2FE" stroke="#7DD3FC"/><text x="26" y="34" class="t">AI coding host</text><text x="26" y="62" class="b">Claude Code · Codex · Kiro · Qoder · Cursor · OpenCode · ZCode · Pi</text><text x="26" y="88" class="s">Provides models, tools, permissions, and execution primitives;<tspan x="26" dy="16">host runtime is a rebuildable delivery projection</tspan></text><rect x="790" y="28" width="260" height="58" rx="12" fill="#fff"/><text x="920" y="53" class="chip">Generate code and run commands</text><text x="920" y="73" class="chip">The host executes</text></g>
<path d="M600 243V278" class="arrow"/><g transform="translate(55 280)" filter="url(#shadow)"><rect width="1090" height="155" rx="18" fill="#EEF2FF" stroke="#A5B4FC"/><text x="26" y="34" class="t">spec-first connection and governance layer</text><text x="26" y="62" class="b">Intent · Context · Scope · Artifact · Claim · Evidence · Handoff · Knowledge</text><rect x="26" y="84" width="320" height="48" rx="10" fill="#fff"/><text x="186" y="105" class="chip">Scripts / Tools</text><text x="186" y="119" class="s" text-anchor="middle">Prepare paths, schemas, hashes,<tspan x="186" dy="15">exit codes, and other facts</tspan></text><rect x="385" y="84" width="320" height="48" rx="10" fill="#fff"/><text x="545" y="105" class="chip">LLM / Agents</text><text x="545" y="119" class="s" text-anchor="middle">Judge requirements, trade-offs,<tspan x="545" dy="15">risks, and semantic adequacy</tspan></text><rect x="744" y="84" width="320" height="48" rx="10" fill="#fff"/><text x="904" y="105" class="chip">Project owner</text><text x="904" y="119" class="s" text-anchor="middle">Authorize side effects, decide value,<tspan x="904" dy="15">and accept semantics</tspan></text></g>
<path d="M600 435V468" class="arrow"/><g transform="translate(55 470)" filter="url(#shadow)"><rect width="1090" height="150" rx="18" fill="#ECFDF3" stroke="#86EFAC"/><text x="26" y="34" class="t">Project-owned source &amp; evidence</text><text x="26" y="62" class="b">Codebase → Spec → Plan → Tasks → Code → Review → Knowledge</text><g transform="translate(26 82)"><rect width="180" height="40" rx="10" fill="#fff"/><text x="90" y="25" class="chip">canonical source</text><rect x="195" width="180" height="40" rx="10" fill="#fff"/><text x="285" y="25" class="chip">workflow artifacts</text><rect x="390" width="180" height="40" rx="10" fill="#fff"/><text x="480" y="25" class="chip">verification evidence</text><rect x="585" width="180" height="40" rx="10" fill="#fff"/><text x="675" y="25" class="chip">durable knowledge</text><rect x="780" width="250" height="40" rx="10" fill="#fff"/><text x="905" y="18" class="chip">Traceable, invalidatable,<tspan x="905" dy="15">reusable</tspan></text></g></g>
</svg>
